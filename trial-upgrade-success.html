<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Received - Cloud UKO</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="demo-apps.css">
</head>
<body class="demo-app-body">

    <header class="demo-app-bar">
        <a href="index.html" class="demo-app-logo">
            <img src="img/logo/clouduko-logo.png" alt="Cloud UKO">
        </a>
        <div class="demo-app-bar-title">Payment Received</div>
    </header>

    <main class="demo-app-main" style="max-width: 520px; text-align: center;">
        <div class="demo-card">
            <div class="demo-app-badge" style="margin-bottom: 1rem;">Thank You</div>
            <h1 style="margin-bottom: 1rem;">Payment received</h1>
            <p style="color: var(--text-secondary); margin-bottom: 1.5rem;">
                PayFast is finalising your payment - this usually takes a few seconds. Your access updates automatically
                once that's done; if it still shows as a trial after a minute, just refresh.
            </p>
            <div class="demo-form-actions" style="justify-content: center;">
                <a href="demos.html" class="btn btn-primary">Back to Demos →</a>
                <a href="trial-account.html" class="demo-app-btn-ghost">View My Account</a>
            </div>
        </div>
    </main>
</body>
</html>
