<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POS System Demo - Cloud UKO</title>
    <meta name="description" content="Try a live, interactive demo of the point-of-sale system Cloud UKO builds for retail and hospitality clients.">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="demo-apps.css">
</head>
<body class="demo-app-body">

    <header class="demo-app-bar">
        <a href="index.html" class="demo-app-logo">
            <img src="img/logo/clouduko-logo.png" alt="Cloud UKO">
        </a>
        <div class="demo-app-bar-title">
            POS System <span class="demo-app-badge">Live Demo</span>
        </div>
        <div class="demo-app-bar-actions">
            <button type="button" class="demo-app-btn-ghost" id="resetBtn">Reset Demo Data</button>
            <a href="demos.html" class="demo-app-btn-ghost">← Back to Demos</a>
        </div>
    </header>
    <p class="demo-app-note">This is a self-contained sandbox - everything here is saved only in your browser, nothing is sent anywhere. Reset it any time.</p>

    <main class="demo-app-main">

        <div class="demo-stats" style="margin-bottom: 1.5rem;">
            <div class="demo-stat-card">
                <div class="demo-stat-value" id="statOrders">0</div>
                <div class="demo-stat-label">Sales Today</div>
            </div>
            <div class="demo-stat-card">
                <div class="demo-stat-value" id="statRevenue">R 0.00</div>
                <div class="demo-stat-label">Revenue Today</div>
            </div>
        </div>

        <!-- Sale screen -->
        <div id="saleScreen">
            <div class="demo-category-row" id="categoryRow"></div>

            <div class="demo-pos-layout">
                <div class="demo-product-grid" id="productGrid"></div>

                <aside class="demo-cart">
                    <h3>Current Sale</h3>
                    <div id="cartItems"></div>
                    <div class="demo-summary" id="cartSummary" style="display:none;">
                        <div class="demo-summary-row"><span>Subtotal</span><span id="cartSubtotal">R 0.00</span></div>
                        <div class="demo-summary-row"><span>VAT (15%)</span><span id="cartVat">R 0.00</span></div>
                        <div class="demo-summary-row total"><span>Total</span><span id="cartTotal">R 0.00</span></div>
                    </div>
                    <div class="demo-form-actions">
                        <button type="button" class="btn btn-primary" id="checkoutBtn" style="width:100%; justify-content:center;" disabled>Checkout</button>
                    </div>
                    <div class="demo-form-actions">
                        <button type="button" class="demo-app-btn-ghost" id="clearCartBtn" style="width:100%; justify-content:center;">Clear Sale</button>
                    </div>
                </aside>
            </div>
        </div>

        <!-- Receipt screen -->
        <div id="receiptScreen" style="display:none;">
            <div class="demo-receipt" id="receiptContent"></div>
            <div class="demo-form-actions" style="justify-content:center; margin-top: 1.5rem;">
                <button type="button" class="btn btn-primary" id="newSaleBtn">Start New Sale</button>
            </div>
        </div>

    </main>

    <div class="demo-toast" id="toast"></div>

    <script>
        const STORAGE_KEY = 'clouduko_demo_pos';
        const VAT_RATE = 0.15;

        const PRODUCTS = [
            { id: 1, name: 'Cappuccino', price: 38, emoji: '☕', category: 'Drinks' },
            { id: 2, name: 'Iced Latte', price: 42, emoji: '🧋', category: 'Drinks' },
            { id: 3, name: 'Fresh Orange Juice', price: 35, emoji: '🧃', category: 'Drinks' },
            { id: 4, name: 'Bottled Water', price: 20, emoji: '💧', category: 'Drinks' },
            { id: 5, name: 'Chicken Burger', price: 89, emoji: '🍔', category: 'Food' },
            { id: 6, name: 'Margherita Pizza', price: 115, emoji: '🍕', category: 'Food' },
            { id: 7, name: 'Caesar Salad', price: 68, emoji: '🥗', category: 'Food' },
            { id: 8, name: 'Toasted Sandwich', price: 52, emoji: '🥪', category: 'Food' },
            { id: 9, name: 'Chocolate Muffin', price: 32, emoji: '🧁', category: 'Bakery' },
            { id: 10, name: 'Croissant', price: 28, emoji: '🥐', category: 'Bakery' },
            { id: 11, name: 'Scone & Jam', price: 30, emoji: '🍞', category: 'Bakery' },
            { id: 12, name: 'Gift Voucher', price: 100, emoji: '🎁', category: 'Other' }
        ];

        const CATEGORIES = ['All', 'Drinks', 'Food', 'Bakery', 'Other'];

        function seedData() {
            return { cart: [], orderNumber: 1, salesToday: { count: 0, total: 0 } };
        }

        function loadData() {
            try {
                const raw = localStorage.getItem(STORAGE_KEY);
                if (raw) return JSON.parse(raw);
            } catch (e) { /* fall through to reseed */ }
            const seeded = seedData();
            saveData(seeded);
            return seeded;
        }

        function saveData(d) { localStorage.setItem(STORAGE_KEY, JSON.stringify(d)); }

        let data = loadData();
        let activeCategory = 'All';

        function formatRand(n) {
            return 'R ' + Number(n).toLocaleString('en-ZA', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        }

        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.classList.add('show');
            clearTimeout(showToast._t);
            showToast._t = setTimeout(() => toast.classList.remove('show'), 1800);
        }

        function renderCategories() {
            document.getElementById('categoryRow').innerHTML = CATEGORIES.map(c => `
                <button type="button" class="demo-category-btn ${c === activeCategory ? 'active' : ''}" data-cat="${c}">${c}</button>
            `).join('');
        }

        function renderProducts() {
            const list = activeCategory === 'All' ? PRODUCTS : PRODUCTS.filter(p => p.category === activeCategory);
            document.getElementById('productGrid').innerHTML = list.map(p => `
                <div class="demo-product-card" data-add="${p.id}">
                    <div class="demo-product-emoji">${p.emoji}</div>
                    <div class="demo-product-name">${escapeHtml(p.name)}</div>
                    <div class="demo-product-price">${formatRand(p.price)}</div>
                </div>
            `).join('');
        }

        function renderCart() {
            const cartEl = document.getElementById('cartItems');
            const summaryEl = document.getElementById('cartSummary');
            const checkoutBtn = document.getElementById('checkoutBtn');

            if (!data.cart.length) {
                cartEl.innerHTML = '<div class="demo-cart-empty">Cart is empty.<br>Tap a product to add it.</div>';
                summaryEl.style.display = 'none';
                checkoutBtn.disabled = true;
                return;
            }

            cartEl.innerHTML = data.cart.map(item => `
                <div class="demo-cart-item">
                    <div style="flex:1;">
                        <div class="demo-cart-item-name">${escapeHtml(item.name)}</div>
                        <div class="demo-cart-item-price">${formatRand(item.price)} each</div>
                    </div>
                    <div class="demo-qty-stepper">
                        <button type="button" data-dec="${item.id}">−</button>
                        <span>${item.qty}</span>
                        <button type="button" data-inc="${item.id}">+</button>
                    </div>
                </div>
            `).join('');

            const subtotal = data.cart.reduce((s, i) => s + i.qty * i.price, 0);
            const vat = subtotal * VAT_RATE;
            document.getElementById('cartSubtotal').textContent = formatRand(subtotal);
            document.getElementById('cartVat').textContent = formatRand(vat);
            document.getElementById('cartTotal').textContent = formatRand(subtotal + vat);
            summaryEl.style.display = 'block';
            checkoutBtn.disabled = false;
        }

        function renderStats() {
            document.getElementById('statOrders').textContent = data.salesToday.count;
            document.getElementById('statRevenue').textContent = formatRand(data.salesToday.total);
        }

        function addToCart(productId) {
            const product = PRODUCTS.find(p => p.id === productId);
            if (!product) return;
            const existing = data.cart.find(i => i.id === productId);
            if (existing) {
                existing.qty++;
            } else {
                data.cart.push({ id: product.id, name: product.name, price: product.price, qty: 1 });
            }
            saveData(data);
            renderCart();
        }

        document.getElementById('productGrid').addEventListener('click', (e) => {
            const card = e.target.closest('[data-add]');
            if (!card) return;
            addToCart(Number(card.getAttribute('data-add')));
            showToast('Added to sale');
        });

        document.getElementById('categoryRow').addEventListener('click', (e) => {
            const btn = e.target.closest('[data-cat]');
            if (!btn) return;
            activeCategory = btn.getAttribute('data-cat');
            renderCategories();
            renderProducts();
        });

        document.getElementById('cartItems').addEventListener('click', (e) => {
            const incId = e.target.getAttribute('data-inc');
            const decId = e.target.getAttribute('data-dec');
            if (incId) {
                const item = data.cart.find(i => i.id === Number(incId));
                if (item) item.qty++;
            } else if (decId) {
                const item = data.cart.find(i => i.id === Number(decId));
                if (item) {
                    item.qty--;
                    if (item.qty <= 0) data.cart = data.cart.filter(i => i.id !== item.id);
                }
            }
            saveData(data);
            renderCart();
        });

        document.getElementById('clearCartBtn').addEventListener('click', () => {
            if (!data.cart.length) return;
            if (!confirm('Clear the current sale?')) return;
            data.cart = [];
            saveData(data);
            renderCart();
        });

        document.getElementById('checkoutBtn').addEventListener('click', () => {
            if (!data.cart.length) return;
            const subtotal = data.cart.reduce((s, i) => s + i.qty * i.price, 0);
            const vat = subtotal * VAT_RATE;
            const total = subtotal + vat;
            const orderNum = 'ORD-' + String(data.orderNumber).padStart(4, '0');
            const now = new Date();

            document.getElementById('receiptContent').innerHTML = `
                <h3>Cloud UKO Demo Store</h3>
                <p style="text-align:center; color: var(--text-muted); font-size: 0.8rem; margin-bottom: 1rem;">
                    ${orderNum} &middot; ${now.toLocaleDateString('en-ZA')} ${now.toLocaleTimeString('en-ZA', { hour: '2-digit', minute: '2-digit' })}
                </p>
                <div class="demo-receipt-divider"></div>
                ${data.cart.map(i => `
                    <div class="demo-receipt-row"><span>${i.qty} x ${escapeHtml(i.name)}</span><span>${formatRand(i.qty * i.price)}</span></div>
                `).join('')}
                <div class="demo-receipt-divider"></div>
                <div class="demo-receipt-row"><span>Subtotal</span><span>${formatRand(subtotal)}</span></div>
                <div class="demo-receipt-row"><span>VAT (15%)</span><span>${formatRand(vat)}</span></div>
                <div class="demo-receipt-row" style="font-weight:700; font-size:1rem;"><span>Total</span><span>${formatRand(total)}</span></div>
                <div class="demo-receipt-divider"></div>
                <p style="text-align:center; font-size: 0.8rem; color: var(--text-muted);">Thank you for your order!</p>
            `;

            data.salesToday.count++;
            data.salesToday.total += total;
            data.orderNumber++;
            data.cart = [];
            saveData(data);

            renderStats();
            renderCart();
            document.getElementById('saleScreen').style.display = 'none';
            document.getElementById('receiptScreen').style.display = 'block';
        });

        document.getElementById('newSaleBtn').addEventListener('click', () => {
            document.getElementById('receiptScreen').style.display = 'none';
            document.getElementById('saleScreen').style.display = 'block';
        });

        document.getElementById('resetBtn').addEventListener('click', () => {
            if (!confirm('Reset all demo data (cart and today\'s sales)?')) return;
            data = seedData();
            saveData(data);
            renderStats();
            renderCart();
            document.getElementById('receiptScreen').style.display = 'none';
            document.getElementById('saleScreen').style.display = 'block';
            showToast('Demo data reset');
        });

        // Init
        renderCategories();
        renderProducts();
        renderCart();
        renderStats();
    </script>
</body>
</html>
