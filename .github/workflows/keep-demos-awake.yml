name: Keep Demos Awake

# The in-site ERP, Invoicing and POS demos (demo-*.html) are static, so
# there's nothing to keep awake for them. This pings the external apps
# the site links to - the Booking & Marketplace app and the live School
# ERP demo on Render's free tier, which otherwise sleeps after ~15 min
# idle and takes 30s+ to wake when a prospect clicks through.
# Self-expires so it doesn't run forever unnoticed - push the cutoff
# date back (or delete this file) if you need it longer.

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Check the expiry window
        id: gate
        run: |
          cutoff="2026-12-08"
          today=$(date -u +%F)
          if [[ "$today" > "$cutoff" ]]; then
            echo "Past $cutoff - skipping pings. Edit the cutoff date in this workflow (or delete .github/workflows/keep-demos-awake.yml) to keep this running."
            echo "expired=true" >> "$GITHUB_OUTPUT"
          else
            echo "expired=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Ping demo apps
        if: steps.gate.outputs.expired == 'false'
        run: |
          urls=(
            "https://online-tutor-web.vercel.app/"
            "https://clouduko-erp.onrender.com/"
          )
          # Best-effort: log status codes but never fail the job. A cold
          # free-tier instance can take >25s to wake, which would otherwise
          # show as a spurious red X every time it happens.
          for url in "${urls[@]}"; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 25 "$url" || echo "000")
            echo "$code  $url"
          done
