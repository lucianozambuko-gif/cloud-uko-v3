<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Start Your Free Trial - Cloud UKO</title>
    <meta name="description" content="Sign up for a free 7-day trial of the Cloud UKO ERP, Invoicing, and POS demo systems.">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="demo-apps.css">
</head>
<body class="demo-app-body">

    <header class="demo-app-bar">
        <a href="index.html" class="demo-app-logo">
            <img src="img/logo/clouduko-logo.png" alt="Cloud UKO">
        </a>
        <div class="demo-app-bar-title">Start Your Free Trial</div>
        <div class="demo-app-bar-actions">
            <a href="demos.html" class="demo-app-btn-ghost">← Back to Demos</a>
        </div>
    </header>

    <main class="demo-app-main" style="max-width: 480px;">
        <div class="demo-card">
            <div class="demo-card-header">
                <h2>7 Days, Full Access</h2>
            </div>
            <p style="color: var(--text-secondary); margin-bottom: 1.5rem; font-size: 0.9rem;">
                One signup unlocks the ERP, Invoicing, and POS demos for 7 days. No credit card required to start.
            </p>

            <form id="signupForm">
                <div class="demo-field" style="margin-bottom: 1rem;">
                    <label for="fullName">Full name</label>
                    <input type="text" id="fullName" required placeholder="Your name">
                </div>
                <div class="demo-field" style="margin-bottom: 1rem;">
                    <label for="businessName">Business name</label>
                    <input type="text" id="businessName" required placeholder="Your company">
                </div>
                <div class="demo-field" style="margin-bottom: 1rem;">
                    <label for="email">Email</label>
                    <input type="email" id="email" required placeholder="you@company.com">
                </div>
                <div class="demo-field" style="margin-bottom: 1.5rem;">
                    <label for="password">Password</label>
                    <input type="password" id="password" required minlength="6" placeholder="At least 6 characters">
                </div>
                <button type="submit" class="btn btn-primary" id="signupBtn" style="width:100%; justify-content:center;">Start Free Trial →</button>
                <p id="signupMsg" style="color: #dc2626; font-size: 0.85rem; margin-top: 0.75rem; min-height: 1.2em;"></p>
            </form>

            <p style="text-align:center; font-size: 0.85rem; color: var(--text-muted); margin-top: 1rem;">
                Already have an account? <a href="trial-login.html" style="color: var(--accent-blue); font-weight: 600;">Log in</a>
            </p>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
    <script src="trial-config.js"></script>
    <script src="trial-auth.js"></script>
    <script>
        const params = new URLSearchParams(window.location.search);
        const nextPage = params.get('next') || 'demos.html';

        document.getElementById('signupForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('signupBtn');
            const msg = document.getElementById('signupMsg');
            btn.disabled = true;
            btn.textContent = 'Creating your account…';
            msg.textContent = '';

            const fullName = document.getElementById('fullName').value.trim();
            const businessName = document.getElementById('businessName').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            try {
                const { data, error } = await trialSupabase.auth.signUp({ email, password });
                if (error) throw error;

                const user = data.user;
                if (!user) {
                    // Email confirmation is likely required before a session exists.
                    msg.style.color = 'var(--accent-blue)';
                    msg.textContent = 'Check your email to confirm your account, then log in.';
                    btn.disabled = false;
                    btn.textContent = 'Start Free Trial →';
                    return;
                }

                const { error: insertErr } = await trialSupabase
                    .from('trial_access')
                    .insert({ user_id: user.id, full_name: fullName, business_name: businessName });
                if (insertErr) throw insertErr;

                window.location.href = nextPage.endsWith('.html') ? nextPage : 'demos.html';
            } catch (err) {
                msg.textContent = err.message || 'Something went wrong. Please try again.';
                btn.disabled = false;
                btn.textContent = 'Start Free Trial →';
            }
        });
    </script>
</body>
</html>
